<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Reps</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root, [data-theme="dark"] {
    --bg: #0f0f10; --bg-card: #1a1a1c; --bg-card-hover: #26262a;
    --bg-input: #26262a; --bg-input-focus: #2f2f33; --border: #26262a;
    --text: #ffffff; --text-muted: #8a8a92;
    --green: #22c55e; --red: #ff6b6b; --orange: #ff9e3d;
    --card-bg: linear-gradient(160deg, #1a1530 0%, #0f0f10 100%);
    --card-text: #ffffff;
    --card-text-muted: #8a8a92;
    --card-cell-bg: rgba(255,255,255,0.03);
  }
  [data-theme="twilight"] {
    --bg: #d8d8de; --bg-card: #e8e8ee; --bg-card-hover: #dcdce3;
    --bg-input: #e0e0e7; --bg-input-focus: #d4d4dc; --border: #c8c8d0;
    --text: #2a2a30; --text-muted: #6a6a75;
    --green: #16a34a; --red: #dc2626; --orange: #ea8a2b;
    --card-bg: linear-gradient(160deg, #e0ddf0 0%, #e8e8ee 100%);
    --card-text: #2a2a30;
    --card-text-muted: #6a6a75;
    --card-cell-bg: rgba(0,0,0,0.04);
  }
  [data-theme="light"] {
    --bg: #f4f4f6; --bg-card: #ffffff; --bg-card-hover: #f0f0f3;
    --bg-input: #f0f0f3; --bg-input-focus: #e5e5ea; --border: #e0e0e5;
    --text: #111114; --text-muted: #6b6b75;
    --green: #16a34a; --red: #dc2626; --orange: #ea8a2b;
    --card-bg: linear-gradient(160deg, #f0edff 0%, #ffffff 100%);
    --card-text: #111114;
    --card-text-muted: #6b6b75;
    --card-cell-bg: rgba(0,0,0,0.03);
  }
  [data-accent="purple"]   { --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.15); --accent-light: #c4b5fd; --accent-secondary: #8b6fff; }
  [data-accent="sapphire"] { --accent: #7ba7e0; --accent-soft: rgba(123,167,224,0.15); --accent-light: #a3c4ec; --accent-secondary: #5b8bc7; }
  [data-accent="sky"]      { --accent: #7cc4e0; --accent-soft: rgba(124,196,224,0.15); --accent-light: #a3d7ec; --accent-secondary: #5aa8c7; }
  [data-accent="mint"]     { --accent: #6fc9a8; --accent-soft: rgba(111,201,168,0.15); --accent-light: #98dcc1; --accent-secondary: #4db08b; }
  [data-accent="sage"]     { --accent: #9db88c; --accent-soft: rgba(157,184,140,0.15); --accent-light: #bdd1af; --accent-secondary: #7d9a6d; }
  [data-accent="sand"]     { --accent: #d4b483; --accent-soft: rgba(212,180,131,0.15); --accent-light: #e5cda7; --accent-secondary: #b89464; }
  [data-accent="peach"]    { --accent: #e89b7a; --accent-soft: rgba(232,155,122,0.15); --accent-light: #f0b9a1; --accent-secondary: #cf7b58; }
  [data-accent="coral"]    { --accent: #e88a8a; --accent-soft: rgba(232,138,138,0.15); --accent-light: #f0abab; --accent-secondary: #cf6a6a; }
  [data-accent="rose"]     { --accent: #d98cb3; --accent-soft: rgba(217,140,179,0.15); --accent-light: #e8aec9; --accent-secondary: #bd6c95; }
  [data-accent="lilac"]    { --accent: #b28cc9; --accent-soft: rgba(178,140,201,0.15); --accent-light: #c9aedb; --accent-secondary: #946caf; }
  [data-accent="indigo"]   { --accent: #7b8db8; --accent-soft: rgba(123,141,184,0.15); --accent-light: #a1b0d1; --accent-secondary: #5f7099; }
  [data-accent="graphite"] { --accent: #8a8a92; --accent-soft: rgba(138,138,146,0.15); --accent-light: #a8a8b0; --accent-secondary: #6b6b73; }

  [data-theme="light"][data-accent="purple"]   { --accent: #8b6fff; --accent-soft: rgba(139,111,255,0.15); --accent-light: #6b4de6; --accent-secondary: #5b3fd9; }
  [data-theme="light"][data-accent="sapphire"] { --accent: #5b8bc7; --accent-soft: rgba(91,139,199,0.15); --accent-light: #4a76ad; --accent-secondary: #3d6694; }
  [data-theme="light"][data-accent="sky"]      { --accent: #5aa8c7; --accent-soft: rgba(90,168,199,0.15); --accent-light: #4793b0; --accent-secondary: #3d8099; }
  [data-theme="light"][data-accent="mint"]     { --accent: #4db08b; --accent-soft: rgba(77,176,139,0.15); --accent-light: #3d9a77; --accent-secondary: #348566; }
  [data-theme="light"][data-accent="sage"]     { --accent: #7d9a6d; --accent-soft: rgba(125,154,109,0.15); --accent-light: #6a855a; --accent-secondary: #5a724c; }
  [data-theme="light"][data-accent="sand"]     { --accent: #b89464; --accent-soft: rgba(184,148,100,0.15); --accent-light: #a08050; --accent-secondary: #87683c; }
  [data-theme="light"][data-accent="peach"]    { --accent: #cf7b58; --accent-soft: rgba(207,123,88,0.15); --accent-light: #b86844; --accent-secondary: #a05636; }
  [data-theme="light"][data-accent="coral"]    { --accent: #cf6a6a; --accent-soft: rgba(207,106,106,0.15); --accent-light: #b85555; --accent-secondary: #a04646; }
  [data-theme="light"][data-accent="rose"]     { --accent: #bd6c95; --accent-soft: rgba(189,108,149,0.15); --accent-light: #a55680; --accent-secondary: #8d476b; }
  [data-theme="light"][data-accent="lilac"]    { --accent: #946caf; --accent-soft: rgba(148,108,175,0.15); --accent-light: #7d5a95; --accent-secondary: #694b7e; }
  [data-theme="light"][data-accent="indigo"]   { --accent: #5f7099; --accent-soft: rgba(95,112,153,0.15); --accent-light: #4d5c80; --accent-secondary: #3e4c6b; }
  [data-theme="light"][data-accent="graphite"] { --accent: #6b6b73; --accent-soft: rgba(107,107,115,0.15); --accent-light: #555560; --accent-secondary: #45454e; }

  [data-theme="twilight"][data-accent="purple"]   { --accent: #8b6fff; --accent-soft: rgba(139,111,255,0.18); --accent-light: #6b4de6; --accent-secondary: #5b3fd9; }
  [data-theme="twilight"][data-accent="sapphire"] { --accent: #5b8bc7; --accent-soft: rgba(91,139,199,0.18); --accent-light: #4a76ad; --accent-secondary: #3d6694; }
  [data-theme="twilight"][data-accent="sky"]      { --accent: #5aa8c7; --accent-soft: rgba(90,168,199,0.18); --accent-light: #4793b0; --accent-secondary: #3d8099; }
  [data-theme="twilight"][data-accent="mint"]     { --accent: #4db08b; --accent-soft: rgba(77,176,139,0.18); --accent-light: #3d9a77; --accent-secondary: #348566; }
  [data-theme="twilight"][data-accent="sage"]     { --accent: #7d9a6d; --accent-soft: rgba(125,154,109,0.18); --accent-light: #6a855a; --accent-secondary: #5a724c; }
  [data-theme="twilight"][data-accent="sand"]     { --accent: #b89464; --accent-soft: rgba(184,148,100,0.18); --accent-light: #a08050; --accent-secondary: #87683c; }
  [data-theme="twilight"][data-accent="peach"]    { --accent: #cf7b58; --accent-soft: rgba(207,123,88,0.18); --accent-light: #b86844; --accent-secondary: #a05636; }
  [data-theme="twilight"][data-accent="coral"]    { --accent: #cf6a6a; --accent-soft: rgba(207,106,106,0.18); --accent-light: #b85555; --accent-secondary: #a04646; }
  [data-theme="twilight"][data-accent="rose"]     { --accent: #bd6c95; --accent-soft: rgba(189,108,149,0.18); --accent-light: #a55680; --accent-secondary: #8d476b; }
  [data-theme="twilight"][data-accent="lilac"]    { --accent: #946caf; --accent-soft: rgba(148,108,175,0.18); --accent-light: #7d5a95; --accent-secondary: #694b7e; }
  [data-theme="twilight"][data-accent="indigo"]   { --accent: #5f7099; --accent-soft: rgba(95,112,153,0.18); --accent-light: #4d5c80; --accent-secondary: #3e4c6b; }
  [data-theme="twilight"][data-accent="graphite"] { --accent: #6b6b73; --accent-soft: rgba(107,107,115,0.18); --accent-light: #555560; --accent-secondary: #45454e; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; transition: background 0.2s, color 0.2s; }

  .container { min-height: 100vh; padding: 24px 0 220px; padding-bottom: calc(220px + env(safe-area-inset-bottom, 0px)); }
  .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: -4px; flex-shrink: 0; }
  .icon-sm { width: 16px; height: 16px; }
  .icon-lg { width: 44px; height: 44px; stroke-width: 1.5; }

  .top-tabs { display: flex; gap: 6px; padding: 0 20px 20px; justify-content: center; }
  .top-tab { flex: 1; max-width: 140px; background: var(--bg-card); color: var(--text-muted); border: none; border-radius: 12px; padding: 12px 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .top-tab.active { background: var(--accent); color: #fff; }
  .tabs { display: flex; gap: 6px; padding: 0 20px 16px; justify-content: flex-end; flex-wrap: wrap; }
  .tab-btn { background: var(--bg-card); color: var(--text-muted); border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .timer-bar-wrap { position: sticky; top: 0; z-index: 50; padding: 8px 0 12px; background: linear-gradient(to bottom, var(--bg) 60%, transparent); margin: 0 0 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  .timer-bar { margin: 0 20px; background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px var(--accent-soft); color: #fff; }
  .timer-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: #fff; animation: pulse 2s ease-in-out infinite; }
  .timer-icon svg { stroke: #fff; fill: none; stroke-width: 1.8; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .timer-info { flex: 1; min-width: 0; }
  .timer-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.85; margin-bottom: 2px; }
  .timer-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  .timer-stop { background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .calendar-nav { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; }
  .cal-nav-btn { width: 36px; height: 36px; background: var(--bg-card); color: var(--text); border: none; border-radius: 10px; font-size: 18px; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-range { flex: 1; text-align: center; color: var(--text-muted); font-size: 12px; font-weight: 500; }
  .calendar { display: flex; gap: 6px; padding: 0 20px 20px; overflow-x: auto; scrollbar-width: none; }
  .calendar::-webkit-scrollbar { display: none; }
  .day { flex-shrink: 0; width: 52px; padding: 12px 0; border-radius: 14px; background: var(--bg-card); text-align: center; cursor: pointer; transition: background 0.15s; color: var(--text); }
  .day.active { background: var(--accent); }
  .day .wd { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .day.active .wd { color: rgba(255,255,255,0.8); }
  .day .num { font-size: 18px; font-weight: 600; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin: 6px auto 0; opacity: 0; }
  .day.active .dot { background: #fff; }
  .day.today .num { color: var(--accent); }
  .day.active .num { color: #fff; }

  .page-title { padding: 0 20px 4px; font-size: 26px; font-weight: 700; color: var(--text); }
  .page-date { padding: 0 20px 16px; color: var(--text-muted); font-size: 14px; text-transform: capitalize; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-hint { font-size: 14px; margin-top: 6px; opacity: 0.7; }

  .exercises { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .exercise-card { background: var(--bg-card); border-radius: 16px; padding: 16px; position: relative; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s; }
  .exercise-card.superset { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .exercise-head { display: flex; align-items: flex-start; margin-bottom: 12px; gap: 4px; }
  .exercise-name { font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); flex: 1; min-width: 0; }
  .exercise-name .chart-hint { color: var(--accent); display: inline-flex; padding: 6px; border-radius: 8px; background: var(--accent-soft); }
  .exercise-name .chart-hint svg { width: 18px; height: 18px; }
  .exercise-tonnage { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-right: 4px; align-self: center; }
  .exercise-type-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-light); text-transform: uppercase; letter-spacing: 0.5px; margin-left: 6px; }
  .superset-label { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: #fff; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .collapse-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .collapse-btn svg { transition: transform 0.25s; }
  .collapse-btn.collapsed svg { transform: rotate(-90deg); }

  .rest-timer { display: flex; align-items: center; gap: 8px; padding: 6px 12px; margin: 2px 0 8px 32px; background: var(--accent-soft); border-radius: 10px; color: var(--accent-light); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; animation: restIn 0.3s ease-out; }
  @keyframes restIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .rest-timer.done { background: rgba(34,197,94,0.15); color: var(--green); }

  .set-row { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border-radius: 10px; padding: 4px 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s; position: relative; touch-action: pan-y; will-change: transform; margin-bottom: 8px; }
  .set-row.set-failure { background: var(--accent-soft); }
  .set-num { color: var(--text-muted); font-size: 13px; width: 24px; text-align: center; }
  .set-row input { background: var(--bg-input); border: none; border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px; font-family: inherit; outline: none; flex: 1; text-align: center; min-width: 0; }
  .set-row input:focus { background: var(--bg-input-focus); }
  .times { color: var(--text-muted); font-size: 13px; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; display: inline-flex; align-items: center; justify-content: center; }
  .star-btn { color: var(--text-muted); }
  .star-btn.on { color: #f5b942; }
  .link-btn { background: transparent; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 0; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .prev-hint { font-size: 11px; color: var(--text-muted); margin-top: -4px; margin-bottom: 8px; padding-left: 32px; }

  .bottom-bar { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; width: calc(100% - 40px); max-width: 520px; z-index: 10; }
  .bottom-bar::before { content: ''; position: absolute; inset: -40px -20px -20px -20px; background: linear-gradient(to top, var(--bg) 50%, transparent); pointer-events: none; z-index: -1; }
  .bar-btn { flex: 1 1 0; min-width: 0; border: none; border-radius: 16px; padding: 18px 16px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; transition: transform 0.1s; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .bar-btn:active { transform: scale(0.97); }
  .bar-btn.add { background: var(--accent); color: #fff; box-shadow: 0 8px 24px var(--accent-soft); }
  .bar-btn.start { background: var(--accent-secondary); color: #fff; box-shadow: 0 8px 24px var(--accent-soft); }
  .bar-btn.wide { flex: 1 1 100%; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(8px); }
  .modal-bg.center-mode { align-items: center; padding: 20px; }
  .modal { background: var(--bg); border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; padding: 20px 20px 40px; transition: transform 0.2s; color: var(--text); }
  .modal.center { border-radius: 24px; margin: auto; max-width: 420px; align-self: center; padding: 24px; }
  .handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; touch-action: none; }
  .modal h2 { font-size: 20px; font-weight: 700; margin: 0 0 16px; color: var(--text); }
  .search-input { background: var(--bg-card); border: none; border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 16px; font-family: inherit; outline: none; width: 100%; margin-bottom: 16px; }
  .section-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-top: 4px; font-weight: 500; }
  .category-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: none; border-radius: 14px; padding: 16px; color: var(--text); font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer; width: 100%; margin-bottom: 8px; text-align: left; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); touch-action: pan-y; will-change: transform; }
  .category-item .count { color: var(--text-muted); font-size: 13px; font-weight: 400; display: flex; align-items: center; gap: 8px; }

  .ex-item { background: var(--bg-card); border-radius: 12px; padding: 4px 4px 4px 14px; display: flex; align-items: center; gap: 4px; margin-bottom: 6px; transition: background 0.15s, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); touch-action: pan-y; will-change: transform; }
  .ex-item.selected { background: var(--accent-soft); border: 1px solid var(--accent); }
  .ex-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; flex-shrink: 0; transition: all 0.15s; }
  .ex-check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ex-name-btn { background: transparent; border: none; color: var(--text); font-size: 15px; font-family: inherit; cursor: pointer; text-align: left; flex: 1; padding: 12px 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 10px; flex-shrink: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }

  .drag-handle { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-right: 4px; color: var(--text-muted); cursor: grab; flex-shrink: 0; border-radius: 6px; touch-action: none; }
  .drag-handle svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .edit-row { display: flex; gap: 8px; align-items: center; background: var(--bg-card); border-radius: 12px; padding: 4px 4px 4px 14px; margin-bottom: 6px; }
  .edit-row input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; font-family: inherit; outline: none; padding: 12px 0; }
  .edit-row .ok-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }

  .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px 20px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-cancel { background: var(--bg-card); color: var(--text); border: none; border-radius: 12px; padding: 14px 20px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-dashed { background: transparent; border: 1px dashed var(--border); border-radius: 12px; padding: 14px 16px; color: var(--accent); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; width: 100%; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .input { background: var(--bg-card); border: none; border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 16px; font-family: inherit; outline: none; width: 100%; margin-bottom: 12px; }
  .back-btn { background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-family: inherit; cursor: pointer; padding: 6px 0; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  .chart-wrap { padding: 8px 0 16px; }
  .chart-stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-box { background: var(--bg-card); border-radius: 12px; padding: 12px 16px; flex: 1; min-width: 90px; }
  .stat-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px; }
  .stat-value { font-size: 20px; font-weight: 700; margin-top: 4px; color: var(--text); }
  .history-item { background: var(--bg-card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  .history-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .history-date { font-size: 14px; font-weight: 600; color: var(--text); }
  .history-tonnage { font-size: 12px; color: var(--accent); font-weight: 600; background: var(--accent-soft); padding: 4px 10px; border-radius: 8px; }
  .history-sets { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-set { background: var(--bg-input); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); }
  .history-set.failure { background: var(--accent-soft); }
  .history-set .w { color: var(--text); font-weight: 600; }
  .history-set .r { color: var(--text-muted); }
  .history-set .star-mark { color: #f5b942; margin-left: 4px; font-weight: 700; }

  .tpl-item { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .tpl-info { flex: 1; min-width: 0; }
  .tpl-name { font-weight: 600; font-size: 15px; color: var(--text); }
  .tpl-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .tpl-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .tpl-btn { background: var(--bg-input); color: var(--text); border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; }
  .tpl-btn.primary { background: var(--accent); color: #fff; }

  .result-card { background: var(--card-bg); border: 1px solid var(--accent-soft); border-radius: 24px; padding: 28px 24px; margin-bottom: 16px; position: relative; overflow: hidden; width: 100%; color: var(--card-text); transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .result-card::before { content: ''; position: absolute; top: -60px; right: -60px; width: 180px; height: 180px; background: radial-gradient(circle, var(--accent-soft), transparent 70%); pointer-events: none; }
  .result-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-light); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .result-title { font-size: 26px; font-weight: 800; margin: 0 0 4px; position: relative; z-index: 1; color: var(--card-text); }
  .result-date { color: var(--card-text-muted); font-size: 14px; margin-bottom: 24px; position: relative; z-index: 1; }
  .result-main { display: flex; gap: 16px; margin-bottom: 20px; position: relative; z-index: 1; }
  .result-main-item { flex: 1; min-width: 0; background: var(--card-cell-bg); border-radius: 14px; padding: 14px 16px; }
  .result-main-label { color: var(--card-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .result-main-value { font-size: clamp(16px, 5vw, 24px); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--card-text); overflow-wrap: break-word; word-break: break-word; line-height: 1.2; }
  .result-main-value small { font-size: 12px; color: var(--card-text-muted); font-weight: 500; margin-left: 2px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; position: relative; z-index: 1; }
  .result-cell { background: var(--card-cell-bg); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .result-cell-label { color: var(--card-text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; }
  .result-cell-value { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--card-text); overflow-wrap: break-word; word-break: break-word; }
  .result-muscles { position: relative; z-index: 1; margin-bottom: 8px; }
  .result-muscles-label { color: var(--card-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .result-muscles-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .muscle-tag { background: var(--accent-soft); color: var(--accent-light); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
  .result-footer { position: relative; z-index: 1; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--card-text-muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .result-footer .logo-text { font-weight: 700; color: var(--accent); }

  .measure-card { background: var(--bg-card); border-radius: 16px; padding: 18px 20px; margin: 0 20px 12px; }
  .measure-date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .measure-date { font-size: 15px; font-weight: 600; color: var(--text); }
  .measure-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .measure-cell { background: var(--bg-input); border-radius: 10px; padding: 10px 12px; }
  .measure-cell-label { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .measure-cell-value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  .measure-cell-value small { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-left: 2px; }
  .measure-form { display: flex; flex-direction: column; gap: 12px; }
  .measure-form-row { display: flex; align-items: center; gap: 12px; }
  .measure-form-label { flex: 1; color: var(--text); font-size: 15px; }
  .measure-form-label small { display: block; color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .measure-form input { width: 100px; background: var(--bg-card); border: none; border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 16px; font-family: inherit; outline: none; text-align: center; font-variant-numeric: tabular-nums; }
  .chip-row { display: flex; gap: 6px; margin: 0 20px 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; background: var(--bg-card); color: var(--text-muted); border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .settings-section { margin: 0 20px 20px; background: var(--bg-card); border-radius: 16px; overflow: hidden; }
  .settings-section-title { padding: 16px 20px 8px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .settings-row:first-of-type { border-top: none; }
  .settings-row:not(.disabled):active { background: var(--bg-card-hover); }
  .settings-row.disabled { opacity: 0.45; cursor: not-allowed; }
  .settings-icon { width: 36px; height: 36px; background: var(--bg-input); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-muted); }
  .settings-info { flex: 1; min-width: 0; }
  .settings-label { font-size: 15px; font-weight: 500; color: var(--text); }
  .settings-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .settings-value { color: var(--text-muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }

  .segmented { display: flex; gap: 4px; background: var(--bg-input); padding: 4px; border-radius: 12px; margin: 0 20px 20px; flex-wrap: wrap; }
  .segmented button { flex: 1; min-width: 60px; background: transparent; color: var(--text-muted); border: none; border-radius: 9px; padding: 10px 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .segmented button.active { background: var(--accent); color: #fff; }
  .segmented button.active svg { stroke: #fff; }

  .color-picker { display: flex; gap: 10px; padding: 0 20px 16px; flex-wrap: wrap; }
  .color-dot { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all 0.15s; }
  .color-dot.active { border-color: var(--text); }

  .type-selector { display: flex; gap: 6px; margin-bottom: 12px; }
  .type-opt { flex: 1; background: var(--bg-card); color: var(--text-muted); border: 1px solid transparent; border-radius: 10px; padding: 12px 8px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .type-opt.active { background: var(--accent-soft); color: var(--accent-light); border-color: var(--accent); }
  .type-opt.active svg { stroke: var(--accent-light); }

  .action-menu-item { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: var(--bg-card); border-radius: 12px; margin-bottom: 6px; cursor: pointer; font-size: 15px; color: var(--text); font-family: inherit; border: none; width: 100%; text-align: left; }
  .action-menu-item:active { background: var(--bg-card-hover); }
  .action-menu-item.danger { color: var(--red); }

  .superset-check-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg-card); border-radius: 12px; margin-bottom: 6px; cursor: pointer; font-size: 15px; color: var(--text); border: none; width: 100%; text-align: left; font-family: inherit; }
  .superset-check-item.selected { background: var(--accent-soft); border: 1px solid var(--accent); }
  .superset-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent; flex-shrink: 0; transition: all 0.15s; }
  .superset-check.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .picker-actions { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 16px 0 8px; margin-top: 8px; background: var(--bg); z-index: 10; box-shadow: 0 -20px 20px -10px var(--bg); }
  .picker-actions button { flex: 1; }
  .modal.has-picker-actions { padding-bottom: 100px; }

  .share-card-hidden { position: fixed; left: -9999px; top: 0; width: 1080px; height: 1920px; padding: 120px 80px; display: flex; flex-direction: column; color: #fff; font-family: 'Inter', system-ui, sans-serif; transition: background 0.2s; }
  .share-card-hidden[data-share-theme="dark"] { background: linear-gradient(160deg, #1a1530 0%, #0f0f10 100%); color: #fff; }
  .share-card-hidden[data-share-theme="light"] { background: linear-gradient(160deg, #f0edff 0%, #ffffff 100%); color: #111114; }

  .report-textarea { width: 100%; min-height: 300px; background: var(--bg-card); border: none; border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 13px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; line-height: 1.5; outline: none; resize: vertical; margin-bottom: 12px; -webkit-user-select: text; user-select: text; }

  .toast { position: fixed; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px var(--accent-soft); z-index: 200; animation: toastIn 0.3s ease-out; pointer-events: none; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
